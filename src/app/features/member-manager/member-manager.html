<div class="container">
  <h2>Gerenciamento de Membros</h2>

  <div class="form">
  <mat-form-field>
    <mat-label> E-mail </mat-label>

    <input matInput type="email" [(ngModel)]="email" />
  </mat-form-field>
  <mat-form-field>
    <mat-label> Role </mat-label>

    <mat-select [(ngModel)]="role">
      <mat-option value="Admin"> Admin </mat-option>
      <mat-option value="Operator"> Operator </mat-option>
      <mat-option value="Viewer"> Viewer </mat-option>
    </mat-select>
  </mat-form-field>

  </div>

  <button mat-flat-button (click)="addMembers()" [disabled]="!hasProject || !email.trim()">
    Adicionar
  </button>

  @if (editing) {
    <button mat-flat-button (click)="updateMembers()">Salvar</button>
  }

  <table mat-table [dataSource]="filtered" class="mat-elevation-z2">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let member">#{{ member.id }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>E-mail</th>
      <td mat-cell *matCellDef="let member">
        {{ member.email }}
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let member">
        {{ member.role }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions" class="actions">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let member">
        <button mat-button (click)="editMembers(member)">Editar</button>
        <button mat-button (click)="deleteMembers(member.id)">Deletar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (filtered.length === 0) {
    <p>Nenhum membro nesse projeto.</p>
  }
</div>
